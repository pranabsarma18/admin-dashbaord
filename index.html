<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="searchbar">
                <img width="25" height="25" src="images/search.svg">
                <input type="search">
            </div>
            <div class="profile">
                <div class="notification-icon">
                    <img src="images/bell-ring.svg" width="25" height="25" alt="">
                </div>
                <div class="profile-logo">
                    <img width="40" height="40" src="images/icons8-spider-man-head-48.svg" alt="">
                </div>
                <div class="profile-name">
                    <span>Pranab Sarma</span>
                </div>
            </div>
            <div class="profile-details">
                <div class="profile-details-logo">
                    <img width="70" height="70" src="images/icons8-spider-man-head-96.svg" alt="">
                </div>
                <div class="profile-details-greetings">
                    <span>Hi, there!</span>
                </div>
                <div class="profile-details-name">
                    <span>Pranab Sarma (@pranabsarma18)</span>
                </div>

            </div>
            <div class="header-buttons">
                <div class="new">
                    <button type="button" class="my-btn">New</button>
                </div>
                <div class="upload">
                    <button type="button" class="my-btn">Upload</button>
                </div>
                <div class="share">
                    <button type="button" class="my-btn">Share</button>
                </div>

            </div>
        </header>
        <aside class="sidebar">
            <div class="dashboard">
                <img width="50" src="images/view-dashboard-outline.svg" alt="">
                <span>Dashboard</span>
            </div>
            <div class="sidebar-links1">
                <div class="home">
                    <img width="25" src="images/home.svg" alt="">
                    <span>Home</span>
                </div>
                <div class="sidebar-profile">
                    <img width="25" src="images/card-account-details.svg" alt="">
                    <span>Profile</span>
                </div>
                <div class="messages">
                    <img width="25" src="images/message-reply.svg" alt="">
                    <span>Messages</span>
                </div>
                <div class="history">
                    <img width="25" src="images/history.svg" alt="">
                    <span>History</span>
                </div>
                <div class="tasks">
                    <img width="25" src="images/file-document.svg" alt="">
                    <span>Tasks</span>
                </div>
                <div class="communities">
                    <img width="25" src="images/account-group.svg" alt="">
                    <span>Communities</span>
                </div>
            </div>
            <div class="sidebar-links2">
                <div class="settings">
                    <img width="25" src="images/cog.svg" alt="">
                    <span>Settings</span>
                </div>
                <div class="support">
                    <img width="25" src="images/face-agent.svg" alt="">
                    <span>Support</span>
                </div>
                <div class="privacy">
                    <img width="25" src="images/shield-check.svg" alt="">
                    <span>Privacy</span>
                </div>
            </div>
        </aside>
        <article class="articles">

        </article>

    </div>
</body>
</html>
